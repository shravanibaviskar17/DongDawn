
{% if patient_id %}

<section class="dd-voice-card">

    <div class="dd-voice-header">

        <div>

            <span class="dd-voice-label">
                DONGDAWN VOICE
            </span>

            <h2>
                🎙️ Talk to DongDawn
            </h2>

            <p>
                Speak naturally. I'll help you with
                reminders and cognitive activities.
            </p>

        </div>

        <div class="dd-language-box">

            <label for="ddLanguage">
                🌐 Language
            </label>

            <select
                id="ddLanguage"
                onchange="ddChangeLanguage(this.value)"
            >

                <option value="en">
                    🇮🇳 English
                </option>

                <option value="as">
                    🟢 অসমীয়া — Assamese
                </option>

                <option value="bn">
                    🔵 বাংলা — Bengali
                </option>

                <option value="brx">
                    🟠 बड़ो — Bodo
                </option>

                <option value="mni">
                    🟣 ꯃꯤꯇꯩ ꯂꯣꯟ — Manipuri
                </option>

                <option value="kha">
                    🟡 Khasi
                </option>

                <option value="lus">
                    🟤 Mizo
                </option>

                <option value="ne">
                    🟢 नेपाली — Nepali
                </option>

                <option value="kok">
                    🔴 Kokborok
                </option>

                <option value="hi">
                    🇮🇳 हिन्दी
                </option>

                <option value="mr">
                    🟠 मराठी
                </option>

            </select>

        </div>

    </div>


    <div class="dd-voice-center">

        <button
            type="button"
            id="ddVoiceButton"
            class="dd-mic-button"
            onclick="ddStartListening()"
        >
            🎙️
        </button>

        <div
            id="ddVoiceStatus"
            class="dd-voice-status"
        >
            Tap the microphone and speak
        </div>

        <div
            id="ddVoiceText"
            class="dd-voice-text"
        ></div>

        <div
            id="ddVoiceResponse"
            class="dd-voice-response"
        ></div>

    </div>


    <div class="dd-voice-examples">

        <span>Try saying:</span>

        <button onclick="ddUseExample('reminder')">
            🔔 My next reminder
        </button>

        <button onclick="ddUseExample('medicine')">
            💊 My medicine
        </button>

        <button onclick="ddUseExample('game')">
            🧠 Start a game
        </button>

    </div>

</section>


<style>

.dd-voice-card {

    margin: 30px 0;

    padding: 32px;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            #fff8ed,
            #f4f8ef
        );

    border: 1px solid #eadfce;

    box-shadow:
        0 15px 40px rgba(
            73,
            65,
            50,
            0.08
        );

}


.dd-voice-header {

    display: flex;

    justify-content: space-between;

    gap: 25px;

    align-items: flex-start;

}


.dd-voice-label {

    color: #d97745;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 2px;

}


.dd-voice-card h2 {

    margin: 8px 0;

    color: #24483b;

}


.dd-voice-card p {

    color: #68756f;

    margin: 0;

}


.dd-language-box {

    display: flex;

    flex-direction: column;

    gap: 7px;

}


.dd-language-box label {

    font-size: 13px;

    font-weight: 700;

    color: #526158;

}


.dd-language-box select {

    border: 1px solid #d9cfbf;

    background: white;

    padding: 11px 15px;

    border-radius: 12px;

    font-size: 14px;

    cursor: pointer;

    max-width: 250px;

}


.dd-voice-center {

    text-align: center;

    padding: 30px 10px 20px;

}


.dd-mic-button {

    width: 100px;

    height: 100px;

    border-radius: 50%;

    border: none;

    background: #e78b55;

    color: white;

    font-size: 40px;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(
            231,
            139,
            85,
            0.30
        );

    transition: 0.25s;

}


.dd-mic-button:hover {

    transform: scale(1.06);

}


.dd-mic-button.listening {

    animation: ddPulse 1.2s infinite;

}


@keyframes ddPulse {

    0% {
        box-shadow:
            0 0 0 0 rgba(
                231,
                139,
                85,
                0.45
            );
    }

    70% {
        box-shadow:
            0 0 0 25px rgba(
                231,
                139,
                85,
                0
            );
    }

    100% {
        box-shadow:
            0 0 0 0 rgba(
                231,
                139,
                85,
                0
            );
    }

}


.dd-voice-status {

    margin-top: 18px;

    color: #65716b;

    font-weight: 600;

}


.dd-voice-text {

    margin-top: 12px;

    font-size: 17px;

    color: #24483b;

    min-height: 25px;

}


.dd-voice-response {

    margin: 18px auto 0;

    max-width: 600px;

    padding: 14px 18px;

    border-radius: 15px;

    background: white;

    color: #24483b;

    display: none;

}


.dd-voice-examples {

    display: flex;

    flex-wrap: wrap;

    align-items: center;

    justify-content: center;

    gap: 10px;

}


.dd-voice-examples span {

    color: #7b827d;

    font-size: 13px;

}


.dd-voice-examples button {

    border: 1px solid #ded5c7;

    background: white;

    padding: 10px 14px;

    border-radius: 12px;

    cursor: pointer;

}


@media (max-width: 700px) {

    .dd-voice-header {

        flex-direction: column;

    }

    .dd-language-box {

        width: 100%;

    }

    .dd-language-box select {

        width: 100%;

    }

    .dd-language-box select {

        max-width: none;

    }

}

</style>


<script>

let ddRecognition = null;

let ddLanguage = "en";

const ddPatientId = "{{ patient_id }}";


function ddChangeLanguage(language) {

    ddLanguage = language;

    if (ddRecognition) {

        ddRecognition.stop();

        ddRecognition = null;

    }

    document.getElementById(
        "ddVoiceStatus"
    ).innerText = ddGetText("speak");

}


function ddGetSpeechCode(language) {

    const languages = {

        en: "en-IN",

        as: "as-IN",

        bn: "bn-IN",

        brx: "br-IN",

        mni: "mni-IN",

        kha: "kha-IN",

        lus: "lus-IN",

        ne: "ne-NP",

        kok: "kok-IN",

        hi: "hi-IN",

        mr: "mr-IN"

    };

    return languages[language] || "en-IN";

}

        },

        },

        },

        hi: {
            listening: "मैं सुन रहा हूँ...",
            speak: "माइक्रोफोन दबाकर बोलें",

            error: "माफ़ कीजिए, मैं समझ नहीं पाया।"
        },

        mr: {
            listening: "मी ऐकत आहे...",
            speak: "मायक्रोफोन दाबून बोला",
            unsupported: "या ब्राउझरमध्ये व्हॉइस सुविधा उपलब्ध नाही.",

    return text[ddLanguage]?.[key]
        || text["en"][key];

}


function ddCreateRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        return null;

    }


    const recognition =
        new SpeechRecognition();


    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang =
        ddGetSpeechCode(ddLanguage);


    recognition.onstart = function () {

        const button =
            document.getElementById(
                "ddVoiceButton"
            );

        button.classList.add(
            "listening"
        );

        document.getElementById(
            "ddVoiceStatus"
        ).innerText =
            ddGetText("listening");

    };


    recognition.onresult = function(event) {

        const command =
            event.results[0][0].transcript;


        document.getElementById(
            "ddVoiceText"
        ).innerText =
            "“" + command + "”";


        ddSendCommand(command);

    };


    recognition.onerror = function(event) {

        console.log(
            "Voice error:",
            event.error
        );


        document.getElementById(
            "ddVoiceStatus"
        ).innerText =
            ddGetText("error");


        ddResetMic();

    };


    recognition.onend = function() {

        ddResetMic();

    };


    return recognition;

}


function ddStartListening() {

    if (!ddRecognition) {

        ddRecognition =
            ddCreateRecognition();

    }


    if (!ddRecognition) {

        alert(
            ddGetText("unsupported")
        );

        return;

    }


    ddRecognition.lang =
        ddGetSpeechCode(ddLanguage);


    document.getElementById(
        "ddVoiceResponse"
    ).style.display = "none";


    try {

        ddRecognition.start();

    } catch(error) {

        console.log(error);

    }

}


function ddResetMic() {

    const button =
        document.getElementById(
            "ddVoiceButton"
        );

    button.classList.remove(
        "listening"
    );


    document.getElementById(
        "ddVoiceStatus"
    ).innerText =
        ddGetText("speak");

}


async function ddSendCommand(command) {

    try {

        const response =
            await fetch(
                "/ai/voice/command/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        command: command,

                        patient_id:
                            ddPatientId,

                        language:
                            ddLanguage

                    })

                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Something went wrong."
            );

        }


        const responseBox =
            document.getElementById(
                "ddVoiceResponse"
            );


        responseBox.innerText =
            "🔊 " + data.response;


        responseBox.style.display =
            "block";


        ddSpeak(data.response);


        if (data.redirect) {

            setTimeout(
                function() {

                    window.location.href =
                        data.redirect;

                },
                1800
            );

        }


    } catch(error) {

        console.error(error);

        document.getElementById(
            "ddVoiceResponse"
        ).innerText =
            "⚠️ " + error.message;

        document.getElementById(
            "ddVoiceResponse"
        ).style.display =
            "block";

    }

}


function ddSpeak(text) {

    if (!("speechSynthesis" in window)) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        ddGetSpeechCode(ddLanguage);


    speech.rate = 0.85;

    speech.pitch = 1;


    window.speechSynthesis.speak(
        speech
    );

}

}

</script>

{% endif %}
