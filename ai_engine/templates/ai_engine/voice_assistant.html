<div class="voice-assistant">

    <div class="voice-header">
        <div>
            <h2>🎙️ DongDawn Voice Assistant</h2>
            <p>Speak naturally and DongDawn will assist you.</p>
        </div>
    </div>

    <div class="voice-controls">

        <label for="voiceLanguage">
            Select Language
        </label>

        <select id="voiceLanguage">
            <option value="en-IN">
                English
            </option>

            <option value="hi-IN">
                Hindi
            </option>

            <option value="as-IN">
                Assamese
            </option>

            <option value="lus-IN">
                Mizo
            </option>

            <option value="kha-IN">
                Khasi
            </option>

            <option value="mni-IN">
                Meitei (Manipuri)
            </option>

            <option value="ne-NP">
                Nepali
            </option>

        </select>

        <button
            type="button"
            id="voiceButton"
            onclick="startVoiceAssistant()"
        >
            🎤 Tap to Speak
        </button>

    </div>

    <div class="voice-status" id="voiceStatus">
        Ready to listen
    </div>

    <div class="voice-result">

        <div class="voice-box">

            <h3>🗣️ You said</h3>

            <p id="voiceText">
                Your speech will appear here...
            </p>

        </div>

        <div class="voice-box">

            <h3>🤖 DongDawn</h3>

            <p id="assistantResponse">
                How can I help you?
            </p>

        </div>

    </div>

</div>


<style>

.voice-assistant {

    max-width: 850px;

    margin: 30px auto;

    padding: 25px;

    background: #ffffff;

    border-radius: 20px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);

    font-family: Arial, sans-serif;

}

.voice-header h2 {

    margin: 0;

    color: #333;

}

.voice-header p {

    color: #777;

    margin-top: 8px;

}

.voice-controls {

    margin-top: 25px;

    display: flex;

    flex-direction: column;

    gap: 12px;

}

.voice-controls label {

    font-weight: bold;

    color: #444;

}

#voiceLanguage {

    padding: 12px;

    border-radius: 10px;

    border: 1px solid #ddd;

    font-size: 16px;

}

#voiceButton {

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #6c63ff;

    color: white;

    font-size: 17px;

    cursor: pointer;

}

#voiceButton:hover {

    opacity: 0.9;

}

.voice-status {

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    background: #f5f5f5;

    color: #555;

    text-align: center;

}

.voice-result {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;

    margin-top: 20px;

}

.voice-box {

    padding: 18px;

    border-radius: 15px;

    background: #f8f8ff;

}

.voice-box h3 {

    margin-top: 0;

}

.voice-box p {

    color: #555;

    min-height: 40px;

}


@media (max-width: 700px) {

    .voice-result {

        grid-template-columns: 1fr;

    }

}

</style>


<script>

let recognition;

function startVoiceAssistant() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        document.getElementById("voiceStatus").innerText =
            "Voice recognition is not supported in this browser.";

        return;

    }

    const language =
        document.getElementById("voiceLanguage").value;

    recognition = new SpeechRecognition();

    recognition.lang = language;

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;

    document.getElementById("voiceStatus").innerText =
        "🎤 Listening...";

    document.getElementById("voiceButton").innerText =
        "🔴 Listening...";

    recognition.start();


    recognition.onresult = function(event) {

        const transcript =
            event.results[0][0].transcript;

        document.getElementById("voiceText").innerText =
            transcript;

        document.getElementById("voiceStatus").innerText =
            "Processing...";

        processVoiceCommand(transcript);

    };


    recognition.onerror = function(event) {

        document.getElementById("voiceStatus").innerText =
            "Could not understand your voice. Please try again.";

        document.getElementById("voiceButton").innerText =
            "🎤 Tap to Speak";

    };


    recognition.onend = function() {

        document.getElementById("voiceButton").innerText =
            "🎤 Tap to Speak";

    };

}


function processVoiceCommand(text) {

    const lowerText = text.toLowerCase();

    let response =
        "I heard you. I am still learning this command.";

    if (
        lowerText.includes("memory") ||
        lowerText.includes("game")
    ) {

        response =
            "Let's open your cognitive games.";

    }

    else if (
        lowerText.includes("reminder")
    ) {

        response =
            "I can help you check your reminders.";

    }

    else if (
        lowerText.includes("progress")
    ) {

        response =
            "Let's check your cognitive progress.";

    }

    else if (
        lowerText.includes("hello") ||
        lowerText.includes("hi")
    ) {

        response =
            "Hello! How can I help you today?";

    }

    document.getElementById("assistantResponse").innerText =
        response;

    speakResponse(response);

}


function speakResponse(text) {

    if (!("speechSynthesis" in window)) {

        return;

    }

    const language =
        document.getElementById("voiceLanguage").value;

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = language;

    speech.rate = 0.9;

    speech.pitch = 1;

    window.speechSynthesis.speak(speech);

}

</script>
