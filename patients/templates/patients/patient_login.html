<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DongDawn | Patient Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #fff8ef,
                #ffe8d6
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 45px 40px;

            border-radius: 28px;

            box-shadow:
                0 15px 40px rgba(80, 55, 35, 0.15);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #f4a261;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 36px;
        }

        h1 {
            color: #315c45;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #315c45;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #ddd;

            border-radius: 14px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #f4a261;

            box-shadow:
                0 0 0 3px rgba(244, 162, 97, 0.15);
        }

        .login-button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 15px;

            background: #315c45;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

            transition: 0.3s;
        }

        .login-button:hover {
            background: #244936;
            transform: translateY(-2px);
        }

        .error {
            background: #ffe5e5;

            color: #b42318;

            padding: 12px;

            border-radius: 12px;

            margin-bottom: 20px;
        }

        .footer {
            margin-top: 25px;

            color: #888;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        🏡
    </div>

    <h1>Welcome to DongDawn</h1>

    <p class="subtitle">
        Where Care Feels Like Home.
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>

    <p class="footer">
        Your memories matter. 💚
    </p>

</div>

</body>

</html>
