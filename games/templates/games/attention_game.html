<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attention & Concentration</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            color: #222;
            text-align: center;
        }

        .header {
            background: #315c8c;
            color: white;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            font-size: 20px;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .info {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .info p {
            font-size: 20px;
            margin: 8px;
        }

        .game-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .instruction {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .target {
            font-size: 60px;
            margin: 25px;
            min-height: 80px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .option-button {
            font-size: 35px;
            padding: 25px;
            border: none;
            border-radius: 15px;
            background: #e8eef5;
            cursor: pointer;
        }

        .option-button:hover {
            background: #d4e0ed;
        }

        .option-button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .message {
            font-size: 24px;
            font-weight: bold;
            min-height: 35px;
            margin: 20px;
        }

        .start-button,
        .home-button {
            display: inline-block;
            margin: 15px 8px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .start-button {
            background: #315c8c;
            color: white;
        }

        .home-button {
            background: #777;
            color: white;
        }

        .result-box {
            display: none;
            background: white;
            margin-top: 25px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .result-box h2 {
            font-size: 30px;
        }

        .result-box p {
            font-size: 22px;
        }

        @media (max-width: 600px) {

            .options {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 26px;
            }

            .target {
                font-size: 50px;
            }

        }

    </style>

</head>


<body>

    <div class="header">

        <h1>🎯 Attention & Concentration</h1>

        <p>Find the object that matches the target</p>

    </div>


    <div class="container">


        <div class="info">

            <p>
                Difficulty:
                <strong id="difficulty">
                    Loading...
                </strong>
            </p>

            <p>
                Question:
                <strong id="questionNumber">
                    0
                </strong>
            </p>

            <p>
                Score:
                <strong id="score">
                    0
                </strong>
            </p>

            <p>
                Attempts:
                <strong id="attempts">
                    0
                </strong>
            </p>

        </div>


        <div class="game-box">


            <div
                id="instruction"
                class="instruction">

                Press Start Game

            </div>


            <div
                id="target"
                class="target">
            </div>


            <div
                id="options"
                class="options">
            </div>


            <div
                id="message"
                class="message">
            </div>


        </div>


        <button
            class="start-button"
            onclick="startGame()">

            ▶ Start Game

        </button>


        <a
            href="/patients/"
            class="home-button">

            🏠 Back to Patients

        </a>


        <div
            id="resultBox"
            class="result-box">

            <h2>🎉 Game Completed!</h2>

            <p>
                Your Score:
                <strong id="finalScore"></strong>
            </p>

            <p>
                Accuracy:
                <strong id="finalAccuracy"></strong>%
            </p>

            <p>
                Difficulty:
                <strong id="finalDifficulty"></strong>
            </p>

            <p>
                Attempts:
                <strong id="finalAttempts"></strong>
            </p>

        </div>

    </div>


<script>


const patientId = "{{ patient_id }}";


let currentDifficulty = "easy";

let questions = [];

let currentQuestion = 0;

let score = 0;

let attempts = 0;

let correctAnswers = 0;

let startTime = 0;



/*
EASY QUESTIONS
*/

const easyQuestions = [

    {
        target: "🍎",
        options: ["🍎", "🍌", "🍊", "🍇"],
        answer: "🍎"
    },

    {
        target: "🥛",
        options: ["☕", "🥛", "🍵", "🧃"],
        answer: "🥛"
    },

    {
        target: "📖",
        options: ["📱", "📖", "📕", "📰"],
        answer: "📖"
    },

    {
        target: "🔑",
        options: ["🔑", "🔔", "🔒", "🕰️"],
        answer: "🔑"
    }

];



/*
MEDIUM QUESTIONS
*/

const mediumQuestions = [

    {
        target: "🍎",
        options: ["🍌", "🍎", "🍊", "🍉"],
        answer: "🍎"
    },

    {
        target: "🪑",
        options: ["🛏️", "🪑", "🚪", "🛋️"],
        answer: "🪑"
    },

    {
        target: "⏰",
        options: ["📱", "⌚", "⏰", "📺"],
        answer: "⏰"
    },

    {
        target: "🥄",
        options: ["🍴", "🥄", "🔪", "🥣"],
        answer: "🥄"
    },

    {
        target: "💊",
        options: ["💉", "🩹", "💊", "🧴"],
        answer: "💊"
    }

];



/*
HARD QUESTIONS
*/

const hardQuestions = [

    {
        target: "🍎",
        options: ["🍊", "🍏", "🍎", "🍐"],
        answer: "🍎"
    },

    {
        target: "📱",
        options: ["📺", "📱", "💻", "⌚"],
        answer: "📱"
    },

    {
        target: "🌅",
        options: ["🌙", "☀️", "🌅", "⭐"],
        answer: "🌅"
    },

    {
        target: "💊",
        options: ["🧴", "💉", "💊", "🩹"],
        answer: "💊"
    },

    {
        target: "🪥",
        options: ["🧹", "🪥", "🧴", "🧼"],
        answer: "🪥"
    },

    {
        target: "🍵",
        options: ["☕", "🥛", "🍵", "🧃"],
        answer: "🍵"
    },

    {
        target: "🔑",
        options: ["🔒", "🔑", "🔔", "📎"],
        answer: "🔑"
    }

];



/*
GET DIFFICULTY
*/

async function getDifficulty() {

    if (!patientId) {

        currentDifficulty = "easy";

        document.getElementById(
            "difficulty"
        ).innerText = "Easy";

        return;

    }


    try {

        const response = await fetch(
            `/ai/next-difficulty/?patient_id=${patientId}`
        );


        const data = await response.json();


        if (data.success) {

            currentDifficulty =
                data.difficulty;

        }
        else {

            currentDifficulty = "easy";

        }

    }

    catch (error) {

        console.error(
            "Difficulty error:",
            error
        );

        currentDifficulty = "easy";

    }


    document.getElementById(
        "difficulty"
    ).innerText =
        currentDifficulty
            .charAt(0)
            .toUpperCase()
        +
        currentDifficulty.slice(1);

}



/*
SELECT QUESTIONS
*/

function getQuestionsForDifficulty() {

    if (
        currentDifficulty === "hard"
    ) {

        return hardQuestions;

    }


    if (
        currentDifficulty === "medium"
    ) {

        return mediumQuestions;

    }


    return easyQuestions;

}



/*
START GAME
*/

async function startGame() {

    await getDifficulty();


    questions =
        getQuestionsForDifficulty();


    currentQuestion = 0;

    score = 0;

    attempts = 0;

    correctAnswers = 0;

    startTime = Date.now();


    document.getElementById(
        "score"
    ).innerText = score;


    document.getElementById(
        "attempts"
    ).innerText = attempts;


    document.getElementById(
        "resultBox"
    ).style.display = "none";


    showQuestion();

}



/*
SHOW QUESTION
*/

function showQuestion() {

    if (
        currentQuestion >= questions.length
    ) {

        endGame();

        return;

    }


    const question =
        questions[currentQuestion];


    document.getElementById(
        "questionNumber"
    ).innerText =
        `${currentQuestion + 1} / ${questions.length}`;


    document.getElementById(
        "instruction"
    ).innerText =
        "Find the matching object";


    document.getElementById(
        "target"
    ).innerText =
        question.target;


    const options =
        document.getElementById(
            "options"
        );


    options.innerHTML = "";


    question.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option-button";


            button.innerText =
                option;


            button.onclick =
                function() {

                    checkAnswer(
                        option,
                        question.answer
                    );

                };


            options.appendChild(
                button
            );

        }
    );


    document.getElementById(
        "message"
    ).innerText = "";

}



/*
CHECK ANSWER
*/

function checkAnswer(
    selected,
    correct
) {

    attempts++;


    const buttons =
        document.querySelectorAll(
            ".option-button"
        );


    buttons.forEach(
        button => {

            button.disabled = true;

        }
    );


    if (
        selected === correct
    ) {

        score += 10;

        correctAnswers++;


        document.getElementById(
            "message"
        ).innerText =
            "✅ Correct! Great attention!";

    }
    else {

        document.getElementById(
            "message"
        ).innerText =
            "❌ Not quite. Try the next one!";

    }


    document.getElementById(
        "score"
    ).innerText = score;


    document.getElementById(
        "attempts"
    ).innerText = attempts;


    setTimeout(
        function() {

            currentQuestion++;

            showQuestion();

        },
        1000
    );

}



/*
END GAME
*/

function endGame() {

    const completionTime =
        (Date.now() - startTime) / 1000;


    let accuracy = 0;


    if (attempts > 0) {

        accuracy =
            (correctAnswers / attempts) * 100;

    }


    accuracy =
        Math.round(accuracy * 100) / 100;


    document.getElementById(
        "finalScore"
    ).innerText = score;


    document.getElementById(
        "finalAccuracy"
    ).innerText = accuracy;


    document.getElementById(
        "finalDifficulty"
    ).innerText =
        currentDifficulty
            .charAt(0)
            .toUpperCase()
        +
        currentDifficulty.slice(1);


    document.getElementById(
        "finalAttempts"
    ).innerText = attempts;


    document.getElementById(
        "resultBox"
    ).style.display = "block";


    saveGameResult(
        score,
        attempts,
        accuracy,
        completionTime
    );

}



/*
SAVE RESULT
*/

function saveGameResult(
    score,
    attempts,
    accuracy,
    completionTime
) {

    fetch(
        "/games/save-result/",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json",

                "X-CSRFToken":
                    getCookie(
                        "csrftoken"
                    )

            },

            body: JSON.stringify({

                game_name:
                    "Attention & Concentration",

                score:
                    score,

                attempts:
                    attempts,

                accuracy:
                    accuracy,

                difficulty:
                    currentDifficulty,

                completion_time:
                    completionTime,

                patient_id:
                    patientId

            })

        }
    )

    .then(
        response =>
            response.json()
    )

    .then(
        data => {

            if (data.success) {

                console.log(
                    "Attention result saved:",
                    data
                );

            }
            else {

                console.error(
                    "Save error:",
                    data.error
                );

            }

        }
    )

    .catch(
        error => {

            console.error(
                "Request failed:",
                error
            );

        }
    );

}



/*
CSRF COOKIE
*/

function getCookie(name) {

    let cookieValue = null;


    if (
        document.cookie &&
        document.cookie !== ""
    ) {

        const cookies =
            document.cookie.split(";");


        for (
            let cookie of cookies
        ) {

            cookie =
                cookie.trim();


            if (
                cookie.startsWith(
                    name + "="
                )
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;

            }

        }

    }


    return cookieValue;

}

</script>

</body>

</html>
